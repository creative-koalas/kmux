[project]
name = "kmux"
version = "0.1.3"
description = "PTY session engine for PsyGo workspaces"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "aiorwlock>=1.5.0",
    "psutil>=7.0.0",
    "pydantic>=2.11.7",
    "pyte>=0.8.2",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kmux"]

[dependency-groups]
dev = [
    "ipython>=9.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
